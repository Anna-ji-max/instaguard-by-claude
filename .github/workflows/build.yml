name: Build InstaGuard APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack zip if needed
        run: |
          if [ ! -f settings.gradle.kts ]; then
            mkdir -p _unz
            for z in *.zip; do [ -f "$z" ] && unzip -oq "$z" -d _unz; done
            P=$(find _unz -name settings.gradle.kts -print -quit)
            [ -n "$P" ] || { echo "No project found"; exit 1; }
            cp -a "$(dirname "$P")"/. .
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon --stacktrace
      - run: mv app/build/outputs/apk/debug/app-debug.apk InstaGuard.apk
      - uses: actions/upload-artifact@v4
        with:
          name: InstaGuard-APK
          path: InstaGuard.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: InstaGuard build ${{ github.run_number }}
          files: InstaGuard.apk
